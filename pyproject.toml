[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robonana"
version = "0.1.0"
description = "Fixed-48 RoboTwin MAC actor/world model with deterministic MoT Q/Value experts."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "einops>=0.8",
  "safetensors>=0.4.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = [
  "accelerate>=1.10",
  "diffusers>=0.38",
  "h5py>=3.10",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "Pillow>=10",
  "wandb>=0.27",
]
preprocess = [
  "diffusers>=0.38",
  "h5py>=3.10",
  "Pillow>=10",
  "transformers>=4.57",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
